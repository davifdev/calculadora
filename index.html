<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <section class="container">
      <div class="calc">
        <div class="previous-operation"></div>
        <div class="current-operation"></div>
      </div>

      <div class="buttons">
        <button class="btn-clear">CE</button>
        <button class="btn-clearAll">C</button>
        <button class="btn-del">&laquo;</button>
        <button class="btn-operator">/</button>

        <button class="btn-num">7</button>
        <button class="btn-num">8</button>
        <button class="btn-num">9</button>
        <button class="btn-operator">x</button>

        <button class="btn-num">4</button>
        <button class="btn-num">5</button>
        <button class="btn-num">6</button>
        <button class="btn-operator">-</button>

        <button class="btn-num">1</button>
        <button class="btn-num">2</button>
        <button class="btn-num">3</button>
        <button class="btn-operator">+</button>

        <button class="btn-num">.</button>
        <button class="btn-num">0</button>
        <button class="btn-equal">=</button>
      </div>
    </section>
    <script src="./script.js"></script>
  </body>
</html>
